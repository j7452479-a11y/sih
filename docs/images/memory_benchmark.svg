<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="40" y="45" fill="#f0f6fc" font-size="20" font-weight="700">SPATIAL REPRESENTATION MEMORY FOOTPRINT &amp; BANDWIDTH COMPARISON</text>
  <text x="40" y="70" fill="#8b949e" font-size="13">Measured over a 100m × 100m × 20m Tactical Volume at 20 Hz Frame Rate</text>

  <!-- Legend -->
  <rect x="580" y="45" width="14" height="14" rx="3" fill="url(#gradRed)"/>
  <text x="602" y="57" fill="#8b949e" font-size="12">Severe Bottleneck / Failure</text>
  <rect x="580" y="68" width="14" height="14" rx="3" fill="url(#gradGreen)"/>
  <text x="602" y="80" fill="#7ee787" font-size="12">Our Tactical MLS (SWaP Edge Ready)</text>

  <!-- Chart Background Lines -->
  <line x1="280" y1="110" x2="280" y2="400" stroke="#30363d" stroke-width="1"/>
  <line x1="430" y1="110" x2="430" y2="400" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  <line x1="580" y1="110" x2="580" y2="400" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>
  <line x1="730" y1="110" x2="730" y2="400" stroke="#21262d" stroke-width="1" stroke-dasharray="4"/>

  <!-- Bar 1: Dense 3D Voxel Grid -->
  <text x="40" y="145" fill="#f0f6fc" font-size="14" font-weight="600">Uniform Dense 3D Voxels</text>
  <text x="40" y="165" fill="#8b949e" font-size="11">5cm resolution (1.6B voxels)</text>
  <rect x="280" y="125" width="550" height="40" rx="5" fill="url(#gradRed)"/>
  <text x="840" y="150" fill="#f85149" font-size="14" font-weight="700">1,600 MB</text>
  <text x="290" y="150" fill="#ffffff" font-size="12" font-weight="600">32.0 GB/s Bus Saturation • Severe Thermal Throttling (&lt;2 FPS)</text>

  <!-- Bar 2: Standard Flat 2D Grid -->
  <text x="40" y="215" fill="#f0f6fc" font-size="14" font-weight="600">Standard Flat 2D Grid</text>
  <text x="40" y="235" fill="#8b949e" font-size="11">Zero vertical elevation stored</text>
  <rect x="280" y="195" width="22" height="40" rx="4" fill="#30363d" stroke="#8b949e" stroke-width="1"/>
  <text x="310" y="220" fill="#8b949e" font-size="13" font-weight="600">4.0 MB</text>
  <text x="365" y="220" fill="#f85149" font-size="11">❌ Blinds planners to ditches, slopes &amp; elevated snipers</text>

  <!-- Bar 3: Single-Surface 2.5D -->
  <text x="40" y="285" fill="#f0f6fc" font-size="14" font-weight="600">Single-Surface 2.5D</text>
  <text x="40" y="305" fill="#8b949e" font-size="11">Single (z_min, z_max) band</text>
  <rect x="280" y="265" width="30" height="40" rx="4" fill="#30363d" stroke="#8b949e" stroke-width="1"/>
  <text x="320" y="290" fill="#8b949e" font-size="13" font-weight="600">8.0 MB</text>
  <text x="380" y="290" fill="#f85149" font-size="11">❌ Bridges collapse into solid walls; rover traversal FALSELY BLOCKED</text>

  <!-- Bar 4: Our 4-Tier Foveated MLS Engine -->
  <text x="40" y="355" fill="#7ee787" font-size="14" font-weight="700">4-Tier Foveated MLS</text>
  <text x="40" y="375" fill="#3fb950" font-size="11">Adaptive 5cm to 50cm (Ours)</text>
  <rect x="280" y="335" width="45" height="44" rx="5" fill="url(#gradGreen)"/>
  <text x="335" y="362" fill="#7ee787" font-size="15" font-weight="700">12.16 MB</text>
  <text x="420" y="362" fill="#7ee787" font-size="12" font-weight="600">✅ &gt;99.24% RAM SAVINGS • 4.5m VOID PRESERVED • &lt;10ms DETERMINISTIC</text>

  <!-- Bottom Details Banner -->
  <rect x="40" y="415" width="820" height="45" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="442" fill="#f0f6fc" font-size="12">
    <tspan fill="#58a6ff" font-weight="700">Key Takeaway:</tspan> We achieve complete 3D topological fidelity for underpasses &amp; spires on an embedded <tspan fill="#7ee787" font-weight="700">15W NVIDIA Jetson</tspan> without sacrificing resolution.
  </text>
</svg>
