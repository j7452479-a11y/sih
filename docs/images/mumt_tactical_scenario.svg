<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#090d13; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#1f6feb" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Grid (100m x 100m Proving Ground) -->
  <rect width="960" height="520" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="40" fill="#58a6ff" font-size="18" font-weight="700">MUM-T TACTICAL PROVING GROUND &amp; OCCLUSION COASTING SCENARIO</text>
  <text x="30" y="60" fill="#8b949e" font-size="12">100m × 100m Bounded Village • Heterogeneous Swarm Fusion • Bridge Void Infiltration</text>

  <!-- Village Boundary -->
  <rect x="40" y="80" width="880" height="400" rx="10" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="55" y="105" fill="#8b949e" font-size="12" font-weight="600">PROVING GROUND PERIMETER (100m × 100m)</text>

  <!-- Overpass Bridge -->
  <rect x="360" y="140" width="140" height="280" rx="4" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="375" y="240" width="110" height="80" rx="2" fill="#238636" opacity="0.3" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="380" y="170" fill="#58a6ff" font-size="11" font-weight="700">CONCRETE OVERPASS</text>
  <text x="380" y="185" fill="#8b949e" font-size="10">Deck: Z = 5.0m - 5.6m</text>
  <text x="380" y="275" fill="#7ee787" font-size="11" font-weight="700">TRAVERSABLE VOID</text>
  <text x="380" y="290" fill="#7ee787" font-size="10">4.5m Clear Underpass</text>

  <!-- Church Spire (+18m Z Apex) -->
  <rect x="660" y="120" width="110" height="110" rx="4" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <polygon points="715,135 680,185 750,185" fill="#d29922" opacity="0.4"/>
  <text x="675" y="205" fill="#e3b341" font-size="11" font-weight="700">CHURCH SPIRE</text>
  <text x="675" y="220" fill="#8b949e" font-size="10">+18.0m Apex Height</text>

  <!-- 4-Story Canyon Building -->
  <rect x="140" y="120" width="120" height="130" rx="4" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
  <text x="155" y="175" fill="#f0f6fc" font-size="11" font-weight="700">4-STORY BLOCK</text>
  <text x="155" y="190" fill="#8b949e" font-size="10">14.0m Concrete</text>

  <!-- Stone Occlusion Wall -->
  <rect x="520" y="310" width="18" height="110" rx="2" fill="#6e7681" stroke="#f85149" stroke-width="1.5"/>
  <text x="470" y="370" fill="#ff7b72" font-size="11" font-weight="700" transform="rotate(-90 470 370)">STONE WALL (2.2m)</text>

  <!-- UAV Orbit Flight Path -->
  <ellipse cx="480" cy="280" rx="240" ry="150" fill="url(#radarSweep)" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="6"/>
  <circle cx="280" cy="190" r="10" fill="#1f6feb"/>
  <text x="260" y="170" fill="#58a6ff" font-size="12" font-weight="700">🚁 UAV (Orbit: R=32m, +30m)</text>

  <!-- Tethered UGV Infiltration Track -->
  <ellipse cx="430" cy="280" rx="130" ry="60" fill="none" stroke="#238636" stroke-width="2"/>
  <circle cx="390" cy="275" r="9" fill="#3fb950"/>
  <text x="310" y="360" fill="#3fb950" font-size="12" font-weight="700">🚙 Tethered UGV (Rover)</text>

  <!-- Hostile Target with Occlusion Coasting -->
  <circle cx="560" cy="360" r="8" fill="#f85149"/>
  <!-- Dotted Coasting Vector behind wall -->
  <line x1="560" y1="360" x2="620" y2="390" stroke="#f85149" stroke-width="2" stroke-dasharray="4"/>
  <circle cx="620" cy="390" r="8" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="2"/>
  <rect x="635" y="375" width="160" height="34" rx="4" fill="#da3633" opacity="0.2" stroke="#f85149" stroke-width="1"/>
  <text x="645" y="390" fill="#ff7b72" font-size="11" font-weight="700">HOSTILE BRAVO [COASTING]</text>
  <text x="645" y="403" fill="#ff7b72" font-size="9">Locked (Frame 78/200 • 3.9s)</text>

  <!-- Dismounted Soldier with ATAK & AR Visor -->
  <circle cx="200" cy="390" r="10" fill="#a371f7"/>
  <text x="140" y="420" fill="#d2a8ff" font-size="12" font-weight="700">🎖️ Soldier (Visor + ATAK)</text>
  <line x1="200" y1="390" x2="550" y2="360" stroke="#a371f7" stroke-width="1" stroke-dasharray="3"/>
  <text x="250" y="400" fill="#d2a8ff" font-size="10">Line of Sight Target Lock (MIL-STD-2525 Diamond)</text>
</svg>
