name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Perception Engine & Mathematical Core Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Core Imports & Configurations
        run: |
          python -c "import config; print('Config loaded successfully')"
          python -c "import core_math.foveated_grid; print('Foveated Grid Engine loaded')"
          python -c "import tracking.multitarget_tracker; print('MTT Kalman Tracker loaded')"
          python -c "import ingestion.jitter_buffer; print('Jitter Buffer loaded')"

      - name: Execute Full PyTest Suite
        run: |
          pytest tests/ -v --durations=10
